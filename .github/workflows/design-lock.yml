name: WhatEatO Design Lock

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-baseline:
    name: WhatEatO Design Lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history for pinned visual baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self-test design-lock checker
        run: python scripts/check_design_lock.py --self-test
      - name: Verify approved WhatEatO visual baseline
        run: python scripts/check_design_lock.py
