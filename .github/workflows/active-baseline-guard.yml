name: WhatEatO active baseline guard
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Require current integration branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" != "feature/i18n-analytics-backend-v1" ]; then
            echo "::error::Stale PR base '$BASE_REF'. Rebase work onto feature/i18n-analytics-backend-v1 and target that branch."
            exit 1
          fi
      - name: Check source branch includes current baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init -q repo
          cd repo
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --no-tags --filter=blob:none origin "$BASE_SHA" "$HEAD_SHA"
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "::error::Branch is behind the current integration base. Update from latest base before continuing."
            exit 1
          fi
