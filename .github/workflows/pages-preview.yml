name: WhatEatO GitHub Pages Preview

on:
  push:
    branches:
      - main
      - feature/github-pages-preview-v1
      - fix/restore-approved-whateato-ui
    paths:
      - 'preview/**'
      - 'scripts/export_pages_preview.py'
      - 'scripts/test_export_pages_preview.py'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: whateato-pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frontend JavaScript
        run: node --check preview/app.js
      - name: Verify export privacy and data rules
        run: python -m unittest discover -s scripts -p 'test_export_pages_preview.py' -v
      - name: Install database read client
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Export read-only snapshot from Neon
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/export_pages_preview.py --output _site
      - name: Static preview QA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site')
          for path in ('index.html','styles.css','app.js','.nojekyll','data/restaurants.json','search/index.html','map/index.html','blog/index.html'):
              assert (root/path).exists(), path
          d=json.loads((root/'data/restaurants.json').read_text(encoding='utf-8'))
          assert d['count'] == len(d['items'])
          assert 9000 <= len(d['items']) <= 10000
          assert not any(('password' in r or 'source_key' in r or 'owner' in r) for r in d['items'])
          assert all(r.get('name') and r.get('id') for r in d['items'])
          assert 'data-page="home"' in (root/'index.html').read_text()
          for page in ('search','map','blog'):
              doc=(root/page/'index.html').read_text()
              assert f'data-page="{page}"' in doc
              assert 'src="../app.js"' in doc
          script=(root/'app.js').read_text()
          for marker in ('date_night','solo_dining','family_dining','budget_friendly','traveler_friendly','WhatEatO Blog'):
              assert marker in script
          print('PASS: static site and public-only records',d['count'])
          PY
      - name: Package Pages bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
