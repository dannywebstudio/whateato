name: WhatEatO Phase 2 HTTP + mobile QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  phase2-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local_ci_only@127.0.0.1:5432/postgres
      WHATEATO_CI_LOCAL_FIXTURE: ONLY_LOCAL_EPHEMERAL
      WHATEATO_ENRICHMENT_STAGE_ACK: LOCAL_CI_ONLY
      WHATEATO_MEDIA_ROOT: ${{ github.workspace }}/ci-media
      WHATEATO_ANALYTICS_ENABLED: 'false'
      # Synthetic fixture ONLY; never reuse this constant for staging/production.
      WHATEATO_REVIEW_MODERATION_ENABLED: 'true'
      WHATEATO_REVIEW_ADMIN_TOKEN: 'ci-only-review-moderation-token-00000000'
      NEXT_PUBLIC_LAUNCH_READY: 'false'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate test scripts
        run: |
          node --check scripts/seed_phase2_smoke.mjs
          node --check scripts/test_phase2_http.mjs
          node --check scripts/test_phase25_browser.mjs
          node --check scripts/enrichment_v1.mjs
          node --check scripts/test_enrichment_v1.mjs
          node --check scripts/test_review_moderation_http.mjs
          node --check scripts/audit_restaurant_quality.mjs
          node --check scripts/report_catalog_coverage.mjs
      - name: Create isolated synthetic fixtures and apply real migrations
        run: node scripts/seed_phase2_smoke.mjs
      - name: Audit source-preserving permit data and human visibility gates
        run: node scripts/audit_restaurant_quality.mjs
      - name: Verify evidence-backed staging intake and publication isolation
        run: node scripts/test_enrichment_v1.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Install isolated Chromium browser for viewport QA
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Start Next.js and check real HTTP + SSR + responsive Chromium
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/whateato-phase2-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/ready >/dev/null; then break; fi
            sleep 2
          done
          node scripts/test_phase2_http.mjs
          node scripts/report_catalog_coverage.mjs
          node scripts/test_phase25_browser.mjs
          node scripts/test_review_moderation_http.mjs
      - name: Upload desktop/mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase25-browser-qa
          path: phase25-browser-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Report server logs on failure
        if: failure()
        run: cat /tmp/whateato-phase2-next.log || true
