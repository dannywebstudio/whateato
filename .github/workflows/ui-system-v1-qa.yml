name: WhatEatO unified UI and grouped hours QA
on:
  push:
    branches: [feature/i18n-analytics-backend-v1]
    paths:
      - 'src/app/globals.css'
      - 'src/app/search/page.tsx'
      - 'src/components/RestaurantMap.tsx'
      - 'src/app/restaurant/[id]/page.tsx'
      - 'src/lib/group-opening-hours.ts'
      - '.github/workflows/ui-system-v1-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm run typecheck
      - run: node --test scripts/verify-google-photo-guard.test.mjs
