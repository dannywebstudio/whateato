name: WhatEatO web CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: node --check scripts/verify_phase15_staging.mjs
      - run: node --check scripts/verify_phase25_deployed.mjs
      - run: node scripts/verify_enrichment_queue.mjs
      - run: node scripts/verify_research_flags.mjs
      - run: node scripts/enrichment_v1.mjs inspect data/enrichment-packets/review/on-the-border-gwanghwamun-20261012.json
      - run: node scripts/enrichment_v1.mjs inspect data/enrichment-packets/review/hoho-daehangno-20261012.json
      - run: node scripts/report_enrichment_progress.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_LAUNCH_READY: 'false'
          NEXT_PUBLIC_SITE_URL: https://example.com
