name: WhatEatO photo preview safety integration
on:
  workflow_dispatch:
  push:
    branches: [feature/i18n-analytics-backend-v1]
    paths:
      - 'src/lib/restaurant-catalog.ts'
      - 'src/lib/geo-catalog.ts'
      - 'src/lib/google-place-photos.ts'
      - 'src/components/GooglePlacesPhotoPreview.tsx'
      - 'scripts/verify-google-photo-preview-gates.test.mjs'
      - '.github/workflows/photo-preview-safety.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm run typecheck
      - run: node --test scripts/verify-google-photo-preview-gates.test.mjs scripts/verify-google-photo-guard.test.mjs
