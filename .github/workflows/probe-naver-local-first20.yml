name: WhatEatO NAVER Local 20-place probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_naver_local_first20.mjs'
      - '.github/workflows/probe-naver-local-first20.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock --no-save pg@8.16.0
      - name: Compare first 20 staging identities with NAVER Local
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          WHATEATO_STAGING_DATABASE_URL: ${{ secrets.WHATEATO_STAGING_DATABASE_URL }}
        run: node scripts/probe_naver_local_first20.mjs
