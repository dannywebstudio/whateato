name: WhatEatO Region Import
on:
  workflow_dispatch:
    inputs:
      city:
        type: choice
        options: [인천, 서울, 부산]
        required: true
        default: 인천
      wave:
        type: number
        required: true
        default: 1
      offset:
        type: number
        required: true
        default: 0
      limit:
        type: number
        required: true
        default: 1000
      write_to_neon:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'pyproj>=3.6,<4' 'psycopg[binary]>=3.2,<4' 'gdown==5.2.0'
      - name: Python check
        run: python -m py_compile scripts/import_localdata_regions.py
      - name: Download official original CSV from verified Google Drive
        run: |
          set -euo pipefail
          mkdir -p /tmp/whateato-region
          python -m gdown --id 10jzGEJQsZwYKqCw9QTPqy08UoUwUNqnQ --no-cookies --output /tmp/whateato-region/source.csv
          test "$(stat -c %s /tmp/whateato-region/source.csv)" -eq 699103898
          echo '403f9d00ca3a5898aa8b3ab45665bd338c1cf2b29b6b917b53f3a5c525b41272  /tmp/whateato-region/source.csv' | sha256sum --check
      - name: Filter closed businesses
        run: |
          python scripts/filter_closed_localdata.py --source /tmp/whateato-region/source.csv --output /tmp/whateato-region/active.csv --report /tmp/whateato-region/report.json --expected-rows 2303303 --expected-open 676107 --expected-closed 1627196
          echo 'b3aa8b1c6e8ea108bd6ecbd06a4f46c1211d2c996265384570e0e0b1d207deec  /tmp/whateato-region/active.csv' | sha256sum --check
      - name: Import only nonpublic drafts when explicitly enabled
        env:
          CITY: ${{ inputs.city }}
          WAVE: ${{ inputs.wave }}
          OFFSET: ${{ inputs.offset }}
          LIMIT: ${{ inputs.limit }}
          ENABLE_IMPORT: ${{ inputs.write_to_neon }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          WHATEATO_IMPORT_CONFIRM: launch-hostinger-20261015
        run: |
          set -euo pipefail
          test "$LIMIT" -ge 1 && test "$LIMIT" -le 5000 && test "$OFFSET" -ge 0
          if [ "$ENABLE_IMPORT" = true ]; then
            test -n "$NEON_DATABASE_URL"
            python scripts/import_localdata_regions.py --file /tmp/whateato-region/active.csv --city "$CITY" --wave "$WAVE" --offset "$OFFSET" --limit "$LIMIT" --commit
          else
            python scripts/import_localdata_regions.py --file /tmp/whateato-region/active.csv --city "$CITY" --wave "$WAVE" --offset "$OFFSET" --limit "$LIMIT"
          fi
      - name: Remove temporary raw data
        if: always()
        run: rm -rf /tmp/whateato-region
